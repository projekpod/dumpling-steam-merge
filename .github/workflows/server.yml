name: Supabase backend

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  push:
    branches: [main]
    paths:
      - "server/**"

permissions:
  contents: read

concurrency:
  group: supabase-backend-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno task check
      - run: deno task test
      - run: deno task test:db

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment credentials
        id: credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_PROJECT_REF" ]]; then
            echo "::notice::Deploy Supabase dilewati. Isi SUPABASE_ACCESS_TOKEN dan SUPABASE_PROJECT_REF di GitHub Secrets untuk mengaktifkan deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v6
        if: steps.credentials.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
      - name: Deploy migrations and Edge Functions
        if: steps.credentials.outputs.enabled == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx --yes supabase@3.2.0 link --project-ref "$SUPABASE_PROJECT_REF" --yes
          npx --yes supabase@3.2.0 db push --remote --skip-vault --yes
          npx --yes supabase@3.2.0 functions deploy --remote --use-api --no-verify-jwt --yes
